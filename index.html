<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXA Sovereign Chain Explorer</title>
  <link rel="icon" type="image/png" href="logoluxa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #05050e;
      --card-bg: rgba(18, 20, 36, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00FFCC;
      --blue: #0066FF;
      --gold: #FFD700;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 20px 16px; }
    .explorer-container { max-width: 1180px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .topbar-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800; color: var(--cyan); display: flex; align-items: center; gap: 10px; }
    .topbar-title img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--cyan); object-fit: cover; }
    .nav-link { background: rgba(0, 102, 255, 0.15); border: 1px solid var(--blue); color: var(--cyan); text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; }

    .node-hero { display: flex; align-items: center; gap: 20px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 16px; padding: 18px; margin-bottom: 24px; }
    .node-status-ring { width: 75px; height: 75px; border-radius: 50%; border: 2px solid var(--cyan); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0, 255, 204, 0.25); flex-shrink: 0; }
    .node-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; flex: 1; }
    .node-info-card { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 12px 14px; }
    .node-info-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    .node-info-value { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 700; color: #fff; }
    .node-info-value.accent { color: var(--cyan); }

    .search-section { background: var(--card-bg); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 16px; padding: 22px; margin-bottom: 28px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
    .search-bar-wrap { display: flex; gap: 10px; margin-top: 14px; }
    .search-input { flex: 1; background: #090a10; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 14px 18px; border-radius: 10px; font-size: 13px; font-family: 'JetBrains Mono', monospace; outline: none; }
    .search-input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 255, 204, 0.25); }
    .search-btn { background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #000; border: none; padding: 0 28px; border-radius: 10px; font-weight: 800; font-size: 13px; font-family: 'Orbitron', sans-serif; cursor: pointer; }

    .card-wrap { margin-top: 20px; background: #0c0d14; border: 1px solid var(--cyan); border-radius: 16px; padding: 22px; text-align: left; }
    .card-wrap.nft-wrap { border-color: var(--gold); }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; margin-bottom: 16px; }
    .badge-ok { background: rgba(34, 197, 94, 0.2); color: var(--green); font-weight: 700; font-size: 11px; padding: 3px 10px; border-radius: 6px; }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--red); font-weight: 700; font-size: 11px; padding: 3px 10px; border-radius: 6px; }
    .nft-display-frame { width: 100%; max-width: 320px; border-radius: 16px; border: 2px solid var(--cyan); display: inline-block; }
    .nft-display-frame.nft-border { border-color: var(--gold); }
    .mono-pill { font-family: 'JetBrains Mono', monospace; font-size: 11px; word-break: break-all; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 12px; border-radius: 6px; color: var(--cyan); display: block; margin-top: 4px; }
    .copy-btn { width: 100%; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .copy-btn:hover { background: var(--cyan); color: #000; }
  </style>
</head>
<body>
  <div class="explorer-container">
    <header class="topbar">
      <div class="topbar-title">
        <img src="logoluxa.png" alt="LUXA" onerror="this.src='logoluxa.png'">
        LUXA Sovereign Chain Explorer
      </div>
      <a href="index.html" class="nav-link">Home ↗</a>
    </header>

    <!-- NODE STATUS -->
    <div class="node-hero">
      <div class="node-status-ring">
        <div style="text-align:center; font-size:10px; font-weight:700; color:var(--cyan); font-family:'JetBrains Mono',monospace;">
          <i class="fas fa-server" style="font-size:18px; display:block; margin-bottom:4px;"></i>
          ONLINE
        </div>
      </div>
      <div class="node-info-grid">
        <div class="node-info-card">
          <span class="node-info-label">Chain ID</span>
          <span class="node-info-value accent">luxa-1</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">Latest Block</span>
          <span class="node-info-value" id="latestBlock">Connecting...</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">Consensus Protocol</span>
          <span class="node-info-value">CometBFT / Cosmos</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">RPC Endpoint</span>
          <span class="node-info-value accent" style="font-size:12px;">rpc.luxaecosystem.xyz</span>
        </div>
      </div>
    </div>

    <!-- SEARCH PANEL -->
    <div class="search-section">
      <div style="font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; color:#fff;">
        🔎 Ledger &amp; Sovereign Asset Query
      </div>
      <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
        Search by transaction hash (0x...), block height, or sovereign wallet address (luxa1...).
      </div>
      <div class="search-bar-wrap">
        <input type="text" id="explorerSearchInput" class="search-input" placeholder="Enter transaction hash, block height, or luxa1... address">
        <button class="search-btn" onclick="triggerSearch()">SEARCH</button>
      </div>
      <div id="explorerSearchResult"></div>
    </div>
  </div>

  <!-- SCRIPT NELLA STESSA ROOT -->
  <script src="explorer.js"></script>
</body>
</html>
