<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXA Sovereign Chain Explorer</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/luxatokenofficial/luxa-website/main/logoluxa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #05050e;
      --bg-card: rgba(18, 20, 36, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00FFCC;
      --blue: #0066FF;
      --gold: #FFD700;
      --green: #22c55e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .explorer-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .topbar-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .topbar-title img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--cyan);
      object-fit: cover;
    }

    .nav-link {
      background: rgba(0, 102, 255, 0.15);
      border: 1px solid var(--blue);
      color: var(--cyan);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link:hover {
      background: rgba(0, 102, 255, 0.3);
      color: #fff;
    }

    .node-hero {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .node-status-ring {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
      flex-shrink: 0;
    }

    .node-status-inner {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .node-status-inner i {
      font-size: 18px;
      display: block;
      margin-bottom: 4px;
    }

    .node-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      flex: 1;
    }

    .node-info-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .node-info-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .node-info-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }

    .node-info-value.accent {
      color: var(--cyan);
    }

    .search-section {
      background: var(--bg-card);
      border: 1px solid rgba(0, 255, 204, 0.25);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .search-bar-wrap {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .search-input {
      flex: 1;
      background: #090a10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
    }

    .search-btn {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #000;
      border: none;
      padding: 0 26px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-ok {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
      font-weight: 700;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .mono-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      word-break: break-all;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--cyan);
      display: block;
      margin-top: 4px;
    }

    .copy-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      margin-top: 14px;
    }

    .copy-btn:hover {
      background: var(--cyan);
      color: #000;
    }

    @media (max-width: 640px) {
      .search-bar-wrap { flex-direction: column; }
      .search-btn { padding: 14px; justify-content: center; }
      .node-hero { flex-direction: column; text-align: center; }
      .topbar { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="explorer-container">
    <header class="topbar">
      <a href="index.html" class="topbar-title">
        <img src="https://raw.githubusercontent.com/luxatokenofficial/luxa-website/main/logoluxa.png" alt="LUXA">
        LUXA Sovereign Chain Explorer
      </a>
      <div style="display: flex; gap: 10px;">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="https://t.me/LuxaToken_bot" target="_blank" class="nav-link"><i class="fab fa-telegram"></i> Launch App ↗</a>
      </div>
    </header>

    <div class="node-hero">
      <div class="node-status-ring">
        <div class="node-status-inner">
          <i class="fas fa-server"></i>
          <span>ONLINE</span>
        </div>
      </div>
      <div class="node-info-grid">
        <div class="node-info-card">
          <span class="node-info-label">Chain ID</span>
          <span class="node-info-value accent">luxa-1</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">Latest Block</span>
          <span class="node-info-value" id="latestBlock">Connecting...</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">Consensus Protocol</span>
          <span class="node-info-value">CometBFT / Cosmos</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">RPC Endpoint</span>
          <span class="node-info-value accent" style="font-size:12px;">rpc.luxaecosystem.xyz</span>
        </div>
      </div>
    </div>

    <!-- SEZIONE DI RICERCA CON INPUT E PULSANTE CORRETTI -->
    <div class="search-section">
      <div style="font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; color:#fff;">
        🔎 Ledger &amp; Sovereign Asset Query
      </div>
      <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
        Search by transaction hash (0x...), block height, or sovereign wallet address.
      </div>
      <div class="search-bar-wrap">
        <input type="text" id="explorerSearchInput" class="search-input" placeholder="Paste transaction hash (0x...), block number, or address">
        <button class="search-btn" onclick="triggerSearch()">
          <i class="fas fa-search"></i> SEARCH
        </button>
      </div>
      <div id="explorerSearchResult"></div>
    </div>
  </div>

  <!-- Script Explorer collegato -->
  <script src="explorer.js"></script>
  <script>
    async function updateNodeStatus() {
      try {
        const res = await fetch('https://rpc.luxaecosystem.xyz/status');
        const data = await res.json();
        const height = data.result?.sync_info?.latest_block_height;
        if (height) document.getElementById('latestBlock').textContent = '#' + Number(height).toLocaleString();
      } catch (_) {
        document.getElementById('latestBlock').textContent = 'luxa-1';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNodeStatus();
      setInterval(updateNodeStatus, 5000);

      // Permette di avviare la ricerca premendo Invio da tastiera
      document.getElementById('explorerSearchInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') triggerSearch();
      });
    });
  </script>
</body>
</html>
