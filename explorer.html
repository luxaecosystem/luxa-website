<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXA Sovereign Chain Explorer</title>
  <link rel="icon" type="image/png" href="logoluxa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #05050e;
      --bg-card: rgba(18, 20, 36, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00FFCC;
      --blue: #0066FF;
      --gold: #FFD700;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; }

    .explorer-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .topbar-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .topbar-title img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--cyan);
      object-fit: cover;
    }

    .topbar-links { display: flex; gap: 10px; }

    .nav-link {
      background: rgba(0, 102, 255, 0.15);
      border: 1px solid var(--blue);
      color: var(--cyan);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-link:hover { background: rgba(0, 102, 255, 0.3); color: #fff; }

    /* Node Status */
    .node-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .node-status-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
    }

    .node-status-inner {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .node-status-inner i { font-size: 17px; display: block; margin-bottom: 4px; }

    .node-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .node-info-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .node-info-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .node-info-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }

    .node-info-value.accent { color: var(--cyan); }

    /* Search */
    .search-section {
      background: var(--bg-card);
      border: 1px solid rgba(0, 255, 204, 0.25);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .search-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

    .search-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .search-input {
      flex: 1;
      background: #090a10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
    }

    .search-btn {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #000;
      border: none;
      padding: 0 26px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Statuses */
    #explorerSearchResult { margin-top: 14px; }

    .explorer-status {
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
      padding: 10px 0;
    }

    .explorer-status--loading { color: var(--cyan); }
    .explorer-status--error { color: var(--red); }

    /* Results */
    .result-card {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--accent, var(--cyan));
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
    }

    .result-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .badge {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 10.5px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid currentColor;
    }

    .badge--info { color: var(--cyan); border-color: var(--cyan); background: rgba(0, 255, 204, 0.15); }
    .badge--ok { color: var(--green); border-color: var(--green); background: rgba(34, 197, 94, 0.15); }
    .badge--fail { color: var(--red); border-color: var(--red); background: rgba(239, 68, 68, 0.15); }

    /* Sovereign Highway Ticker */
    .sovereign-highway-ticker {
      overflow: hidden;
      white-space: nowrap;
      background: #020617;
      padding: 7px 0;
      border-top: 1px solid rgba(0, 255, 204, 0.25);
    }

    .highway-track {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
      animation: tickerRun 16s linear infinite;
    }

    @keyframes tickerRun {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .result-card__facts { font-size: 12px; line-height: 1.9; color: #cbd5e1; }
    .result-card__facts div { display: flex; gap: 8px; }
    .result-card__facts dt { color: var(--muted); min-width: 120px; }
    .result-card__facts dd { word-break: break-all; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .copy-btn {
      width: 100%;
      margin-top: 14px;
      background: transparent;
      border: 1.5px solid var(--accent, var(--cyan));
      color: var(--accent, var(--cyan));
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .explorer-back-btn {
      background: rgba(7, 9, 20, 0.75);
      border: 1px solid rgba(0, 255, 204, 0.45);
      color: var(--cyan);
      padding: 7px 16px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.12);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .explorer-back-btn:hover {
      background: rgba(0, 255, 204, 0.15);
      color: #fff;
    }

    /* Activity */
    .activity-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }

    .activity-section__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .activity-section__header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    #refreshActivityButton { cursor: pointer; font-size: 11px; padding: 6px 12px; border: none; }

    .activity-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .activity-table thead tr { border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: var(--muted); }
    .activity-table th, .activity-table td { padding: 10px 8px; text-align: left; }
    .activity-table tbody tr { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .activity-table tbody tr[data-hash] { cursor: pointer; }
    .activity-table tbody tr[data-hash]:hover { background: rgba(255, 255, 255, 0.03); }
    .activity-table .hash-cell { font-family: 'JetBrains Mono', monospace; }

    @media (max-width: 640px) {
      .search-bar { flex-direction: column; }
      .search-btn { padding: 14px; justify-content: center; }
      .node-hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="explorer-container">
    <header class="topbar">
      <a href="index.html" class="topbar-title">
        <img src="logoluxa.png" alt="LUXA">
        LUXA Sovereign Chain Explorer
      </a>
      <nav class="topbar-links">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="https://t.me/LuxaToken_bot" target="_blank" rel="noopener" class="nav-link"><i class="fab fa-telegram"></i> Launch App</a>
      </nav>
    </header>

    <section class="node-hero" aria-label="Node status">
      <div class="node-status-ring">
        <div class="node-status-inner">
          <i class="fas fa-server"></i>
          <span>ONLINE</span>
        </div>
      </div>
      <div class="node-info-grid">
        <div class="node-info-card">
          <span class="node-info-label">Chain ID</span>
          <span class="node-info-value accent">luxa-1</span>
        </div>
        <div class="node-info-card">
          <span class="node-info-label">Latest Block</span>
          <span class="node-info-value accent" id="latestBlockValue">loading...</span>
        </div>
      </div>
    </section>

    <section class="search-section" aria-label="Search">
      <h2>Ledger &amp; sovereign asset search</h2>
      <p class="search-hint">Search by transaction hash or block number.</p>
      <div class="search-bar">
        <input type="text" id="explorerSearchInput" class="search-input" placeholder="Transaction hash or block number">
        <button type="button" class="search-btn" id="explorerSearchButton">
          <i class="fas fa-search"></i> SEARCH
        </button>
      </div>
      <div id="explorerSearchResult" role="status" aria-live="polite"></div>
    </section>

    <section class="activity-section" aria-label="Recent activity">
      <div class="activity-section__header">
        <h2>Recent on-chain activity</h2>
        <button type="button" class="nav-link" id="refreshActivityButton"><i class="fas fa-sync"></i> Refresh</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="activity-table">
          <thead>
            <tr><th>Hash</th><th>Type</th><th>Amount</th><th>Block</th><th>Status</th></tr>
          </thead>
          <tbody id="activityTableBody">
            <tr><td colspan="5" class="explorer-status explorer-status--loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="explorer.js"></script>
</body>
</html>
